<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rt-primary-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="rt-accent-cyan" x1="100" y1="100" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="rt-amber-point" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <filter id="rt-subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond squircle fintech premium -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="130"
    fill="url(#rt-primary-grad)"
    stroke="#3b82f6"
    stroke-width="12"
    stroke-opacity="0.5"
  />

  <!-- Grille de circuits technologiques discrets -->
  <path
    d="M100 256H130M382 256H412M256 100V130M256 382V412"
    stroke="#93c5fd"
    stroke-width="14"
    stroke-linecap="round"
    stroke-opacity="0.4"
  />

  <!-- Pilier vertical du R -->
  <rect
    x="144"
    y="144"
    width="54"
    height="224"
    rx="27"
    fill="#ffffff"
  />

  <!-- Boucle supérieure du R connectée en circuit haute-vitesse -->
  <path
    d="M174 144H286C330 144 366 175 366 214C366 253 330 284 286 284H174"
    stroke="url(#rt-accent-cyan)"
    stroke-width="50"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Jambe géométrique diagonale d'expansion du R -->
  <path
    d="M250 270L352 368"
    stroke="#ffffff"
    stroke-width="50"
    stroke-linecap="round"
  />

  <!-- Nœud doré d'investissement & rendement financier -->
  <circle
    cx="352"
    cy="174"
    r="24"
    fill="url(#rt-amber-point)"
    filter="url(#rt-subtle-glow)"
  />
</svg>
